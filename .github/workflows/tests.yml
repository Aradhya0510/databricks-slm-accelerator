name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the AI Runtime GPU environment.
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The CPU build of the pinned torch keeps the CI image small; the
          # suite needs no GPU. requirements.txt then sees torch as satisfied.
          pip install "torch==$(grep -oP '^torch==\K.*' requirements.txt)" \
            --index-url https://download.pytorch.org/whl/cpu
          # The same pinned set every notebook installs on AI Runtime.
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests
        # The suite is offline by design: models are built from configs in
        # code rather than downloaded, so no HF Hub token is needed and a hub
        # outage cannot turn CI red.
        env:
          HF_HUB_OFFLINE: "1"
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: pytest -v --cov=src --cov-report=term-missing

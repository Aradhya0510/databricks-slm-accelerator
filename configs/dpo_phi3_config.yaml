model:
  model_name: microsoft/Phi-3.5-mini-instruct
  task_type: dpo
  # Phi-3.5 ships a custom config class that transformers only picks up
  # with remote code enabled. Opted into deliberately, per-config.
  trust_remote_code: true

  quantization: "4bit"
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  use_double_quant: true

  use_peft: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

data:
  train_data_path: /Volumes/<catalog>/<schema>/<volume>/data/dpo/train.jsonl
  val_data_path: /Volumes/<catalog>/<schema>/<volume>/data/dpo/val.jsonl
  data_format: preference
  max_seq_length: 2048
  batch_size: 2
  num_workers: 4
  prompt_column: prompt
  chosen_column: chosen
  rejected_column: rejected

training:
  max_epochs: 1
  learning_rate: 5e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  max_grad_norm: 1.0
  # 'auto' probes bf16 support (Ampere+) and falls back to fp16.
  precision: auto
  dpo_beta: 0.1
  dpo_loss_type: sigmoid
  early_stopping_patience: 0
  monitor_metric: eval_loss
  monitor_mode: min
  checkpoint_dir: /tmp/checkpoints/phi3_dpo
  volume_checkpoint_dir: /Volumes/<catalog>/<schema>/<volume>/checkpoints/phi3_dpo
  save_top_k: 2
  log_every_n_steps: 10

mlflow:
  experiment_name: /Users/<your.email@databricks.com>/slm_phi3_dpo
  run_name: phi3_dpo_run1
  log_model: true
  tags:
    framework: trl
    model_family: phi-3
    task: dpo
    method: qlora

output:
  results_dir: /Volumes/<catalog>/<schema>/<volume>/results/phi3_dpo

serving:
  registered_model_name: <catalog>.<schema>.phi3_dpo
  endpoint_name: phi3-dpo-endpoint
  workload_size: Small
  workload_type: GPU_SMALL
  scale_to_zero: true

monitoring:
  drift_threshold: 0.1
  error_rate_threshold: 0.05
  latency_p95_threshold_ms: 2000

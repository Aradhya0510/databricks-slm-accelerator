[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-slm-accelerator"
version = "0.2.0"
description = "Fine-tune, evaluate, register and serve small language models on Databricks AI Runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Runtime dependencies live in requirements.txt, pinned to what resolves on
# AI Runtime. They are not repeated here so the two cannot drift apart.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# Deliberately not installed as a distribution package. The importable name
# here is literally ``src``, which is far too generic to claim globally --
# installing this repo and the CV accelerator into one environment would have
# them shadow each other. Code runs from a repo checkout instead: notebooks put
# the project root on sys.path, and pytest does the same via the pythonpath
# setting below.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "hub: test requires network access to the HuggingFace Hub",
    "slow: test takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
